[project]
name = "ckanext-cordoba-portal"
version = "0.0.1"
description = "CKAN extension for the Cordoba open data portal"
readme = "README.md"
authors = [
    {name = "Andres Vazquez", email = "andres@data99.com.ar"}
]
license = {text = "AGPL"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [ "CKAN", "cordoba", "open-data", ]
dependencies = []

[project.urls]
Homepage = "https://github.com/parripollo/ckanext-cordoba-portal"

[project.entry-points."ckan.plugins"]
cordoba_portal = "ckanext.cordoba_portal.plugin:CordobaPortalPlugin"
ckan_with_files = "ckanext.cordoba_portal.harvester:CordobaCKANHarvester"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
        "ignore::sqlalchemy.exc.SADeprecationWarning",
        "ignore::sqlalchemy.exc.SAWarning",
        "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W"]

