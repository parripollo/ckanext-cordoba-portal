[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[app:main]
use = config:../ckan/test-core.ini

# Insert any custom config settings to be used when running your extension's
# tests here. These will override the one defined in CKAN core's test-core.ini
ckan.plugins = cordoba_portal scheming_datasets scheming_organizations harvest ckan_harvester ckan_with_files municba villamaria pages
ckanext.pages.about_menu = false
ckan.harvest.mq.type = postgres
scheming.dataset_schemas = ckanext.cordoba_portal:schemas/dataset.yaml
scheming.organization_schemas = ckanext.cordoba_portal:schemas/organization.yaml
# the portal runs the Midnight Blue theme: the tests see what the portal shows
ckan.base_templates_folder = templates-midnight-blue
ckan.base_public_folder = public-midnight-blue


# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
